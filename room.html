<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Responsive WebRTC video conferencing room">
  <title>MeetFlow — Room</title>
  <link rel="shortcut icon" href="./images/logo.png" type="image/png">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/room.css">
</head>
<body>
  <header id="nav">
    <div class="nav--list">
      <a href="./index.html" aria-label="Back to lobby">
        <h3 id="logo">
          <img src="./images/logo.png" alt="">
          <span>MeetFlow</span>
        </h3>
      </a>
    </div>
    <div id="nav__links">
      <button id="members__button" type="button" aria-label="Participants" title="Participants">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </button>
      <button id="chat__button" type="button" aria-label="Chat" title="Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
        </svg>
      </button>
      <a class="nav__link" id="create__room__btn" href="./index.html">New room</a>
    </div>
  </header>

  <main class="container">
    <div id="room__container">
      <aside id="members__container" aria-label="Participants">
        <div id="members__header">
          <p>Participants</p>
          <strong id="members__count">0</strong>
        </div>
        <div id="member__list"></div>
      </aside>

      <section id="stream__container" aria-label="Video meeting">
        <div id="stream__box"></div>
        <div id="streams__container"></div>

        <div class="stream__actions" aria-label="Meeting controls">
          <button id="camera-btn" class="active" type="button" aria-label="Toggle camera" title="Camera">
            <svg viewBox="0 0 24 24"><path d="M17 10V5H3v14h14v-5l4 4V6l-4 4z"/></svg>
          </button>
          <button id="mic-btn" class="active" type="button" aria-label="Toggle microphone" title="Microphone">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </button>
          <button id="screen-btn" type="button" aria-label="Share screen" title="Share screen">
            <svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7v2H7v2h10v-2h-3v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/></svg>
          </button>
          <button id="leave-btn" type="button" aria-label="Leave meeting" title="Leave meeting">
            <svg viewBox="0 0 24 24"><path d="M16 10V6.5L22 12l-6 5.5V14H9v-4h7zM2 5h2v14H2V5z"/></svg>
          </button>
        </div>

        <button id="join-btn" type="button">Join meeting</button>
      </section>

      <aside id="messages__container" aria-label="Chat">
        <div id="messages"></div>
        <form id="message__form" autocomplete="off">
          <input type="text" name="message" maxlength="2000" placeholder="Message everyone…" aria-label="Chat message">
        </form>
      </aside>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const query = new URLSearchParams(location.search);
    const roomId = query.get("room") || "main";
    const uid = sessionStorage.getItem("uid") || crypto.randomUUID();
    const displayName = sessionStorage.getItem("display_name") || "Guest";
    sessionStorage.setItem("uid", uid);
  </script>
  <script src="./js/room.js"></script>
  <script src="./js/room_rtm.js"></script>
  <script src="./js/room_rtc.js"></script>
</body>
</html>
