<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- FIXED: original favicon was a hardcoded local Windows path
         (file:///C|/Users/MATHAN/Desktop/...) which is broken on every
         machine except the original author's. Pointed at the repo's own
         images folder instead. -->
    <link rel="shortcut icon" href="../images/logo.png" type="image/svg+xml">
    <title>Check Camera</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
</head>

<body>
    <div class="webcam">
        <div class="video-outer">
            <video id="video" height="100%" width="100%" autoplay playsinline></video>
        </div>

        <p id="cam-status" class="cam-status"></p>

        <div class="webcam-start-stop">
            <a href="#!" class="btn-start" id="start-btn">Start</a>
            <a href="#!" class="btn-stop" id="stop-btn">Stop</a>
        </div>
    </div>

    <script>
        // FIXED: original code called $(function(){ start(); }) but this
        // page never loads jQuery, so `$` is undefined and the script threw
        // a ReferenceError on load — the camera never auto-started and the
        // error silently broke the rest of the script in some browsers.
        // Replaced with plain DOMContentLoaded, no jQuery dependency needed.

        const video = document.getElementById("video");
        const statusEl = document.getElementById("cam-status");

        function setStatus(msg, isError) {
            statusEl.textContent = msg;
            statusEl.className = "cam-status" + (isError ? " cam-status--error" : "");
        }

        async function startCam() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus("Camera access isn't supported in this browser.", true);
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                setStatus("Camera is working ✅", false);
            } catch (err) {
                // FIXED: original silently logged to console only — user got
                // no on-screen feedback if permission was denied or no
                // camera was found, which is exactly the case this page
                // exists to catch.
                if (err.name === "NotAllowedError") {
                    setStatus("Camera permission was denied. Please allow camera access in your browser settings.", true);
                } else if (err.name === "NotFoundError") {
                    setStatus("No camera was found on this device.", true);
                } else {
                    setStatus("Could not access camera: " + err.message, true);
                }
            }
        }

        function stopCam() {
            const stream = video.srcObject;
            if (!stream) return;
            stream.getTracks().forEach((track) => track.stop());
            video.srcObject = null;
            setStatus("Camera stopped.", false);
        }

        document.getElementById("start-btn").addEventListener("click", (e) => {
            e.preventDefault();
            startCam();
        });
        document.getElementById("stop-btn").addEventListener("click", (e) => {
            e.preventDefault();
            stopCam();
        });

        document.addEventListener("DOMContentLoaded", startCam);
    </script>
</body>

</html>
