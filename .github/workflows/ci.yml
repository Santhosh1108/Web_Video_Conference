name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every script
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run signaling integration tests
        run: npm test

      - name: Smoke-test the signaling server
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then
              echo "Server responded to /healthz"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server never became healthy" >&2
          kill $SERVER_PID
          exit 1
